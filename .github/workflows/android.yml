name: Android APK

# Builds a real, installable APK on GitHub's runners (which have the JDK + Android SDK that the
# development sandbox lacks). Artifacts attach to the run; no hosting, no app store needed.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavour'
        required: true
        default: 'standard'
        type: choice
        options: [standard, withNativeExtractor, both]
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    tags:
      - 'v*'

# `write` is required to attach the APK to a GitHub Release. The workflow only writes on tag
# builds (guarded by `if:`); push builds still only read.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Verify bundle
        run: test -f apps/web/dist/index.html

      # The ubuntu-latest image ships the Android SDK at $ANDROID_HOME. A third-party setup action
      # is one more thing that can break, so we verify what is already there instead.
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK root: $SDK"
          ls "$SDK/platforms" || true
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms"

      # The Capacitor CLI is the authoritative sync path: it validates capacitor.config.json and
      # copies web assets where the Gradle build expects them.
      - name: Sync Capacitor
        working-directory: apps/android
        run: npx cap copy android

      # `secrets` is unavailable in step-level `if:` — pass it through env and branch in shell.
      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.MASHUP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/themashup.jks"
            echo "MASHUP_KEYSTORE_PATH=$RUNNER_TEMP/themashup.jks" >> "$GITHUB_ENV"
            echo "✓ signing keystore decoded"
          else
            echo "ℹ no keystore secret — building with the debug key"
          fi

      - name: Assemble
        working-directory: apps/android/android
        env:
          MASHUP_KEYSTORE_PASSWORD: ${{ secrets.MASHUP_KEYSTORE_PASSWORD }}
          MASHUP_KEY_ALIAS: ${{ secrets.MASHUP_KEY_ALIAS }}
          MASHUP_KEY_PASSWORD: ${{ secrets.MASHUP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Tag pushes carry no inputs, so the default matters. A tag is a release: build release
          # variant (R8-minified, no debug badge, faster runtime). Manual runs can still ask for debug.
          FLAVOR="${{ github.event.inputs.flavor || 'standard' }}"
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          TASK_TYPE="$(tr '[:lower:]' '[:upper:]' <<< "${TYPE:0:1}")${TYPE:1}"

          TASKS=""
          if [ "$FLAVOR" = "both" ]; then
            TASKS=":app:assembleStandard${TASK_TYPE} :app:assembleWithNativeExtractor${TASK_TYPE}"
          elif [ "$FLAVOR" = "withNativeExtractor" ]; then
            TASKS=":app:assembleWithNativeExtractor${TASK_TYPE}"
          else
            TASKS=":app:assembleStandard${TASK_TYPE}"
          fi

          echo "Running: ./gradlew $TASKS"
          set +e
          ./gradlew $TASKS --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
          STATUS=${PIPESTATUS[0]}
          # Surface the first real error lines as a check annotation so failures are readable
          # without downloading logs.
          if [ $STATUS -ne 0 ]; then
            grep -E '^e: |error:|FAILURE:|What went wrong|Caused by' gradle-build.log | head -12 | while IFS= read -r line; do
              echo "::error title=kotlin::$(echo "$line" | head -c 800)"
            done
            tail -30 gradle-build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=gradle tail::$(echo "$line" | head -c 800)"
            done
          else
            # A clean build is not the same as a correct build: Kotlin warnings are where deprecated
            # or misused APIs show up. Surface them even on success.
            COUNT="$(grep -cE '^w: ' gradle-build.log 2>/dev/null || echo 0)"
            echo "::notice title=Kotlin warnings::$COUNT"
            grep -E '^w: ' gradle-build.log | head -12 | while IFS= read -r line; do
              echo "::warning title=kotlin::$(echo "$line" | head -c 800)"
            done
          fi
          exit $STATUS

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: apps/android/android/gradle-build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find apps/android/android/app/build/outputs -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/ || echo "no APKs found"

      # Prove the artefact is a real, signed APK rather than a renamed zip. The verdict is emitted
      # as a check annotation so it is visible without downloading 8 MB.
      - name: Verify APK integrity
        if: always()
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          APK="$(ls out/*.apk 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then
            echo "::error title=No APK::the build produced no .apk in out/"
            exit 1
          fi
          if [ -x "$BT/aapt2" ]; then
            BADGING="$("$BT/aapt2" dump badging "$APK" 2>&1 | grep -E "^package:|^application-label:|sdkVersion|targetSdkVersion" | tr '\n' ' ')"
          else
            BADGING="aapt2 unavailable"
          fi
          if [ -x "$BT/apksigner" ]; then
            SIGNER="$("$BT/apksigner" verify --print-certs "$APK" 2>&1 | grep -i "certificate DN" | head -1)"
            VERIFY="$( "$BT/apksigner" verify "$APK" > /dev/null 2>&1 && echo SIGNED-VALID || echo SIGNATURE-INVALID )"
          else
            SIGNER="apksigner unavailable"; VERIFY="unknown"
          fi
          SIZE="$(du -h "$APK" | cut -f1)"
          echo "APK: $APK ($SIZE) — $VERIFY"
          echo "::notice title=APK built ($SIZE)::$BADGING | $VERIFY | $SIGNER"
          echo "$BADGING | $VERIFY | $SIGNER" > out/apk-verification.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: themashup-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: warn

      # Artifact downloads require a GitHub login and expire in 30 days. A tag build is a release, so
      # publish the APK there too: the asset URL works from a phone browser with no account, which is
      # the only way to sideload without a cable.
      - name: Publish APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Report the actual failure as an annotation: the log is not always downloadable, and
          # "exit code 1" with no cause is the least useful thing CI can say.
          trap 'echo "::error title=release publish failed::gh CLI exited $? for tag $TAG" >&2' ERR
          # Idempotent: a re-run of the same tag must not fail on "release already exists".
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "TheMashup $TAG" \
              --notes "Android build from ${GITHUB_SHA:0:7}. Sideload with the instructions in docs/16-INSTALL-ON-ANDROID.md."
          gh release upload "$TAG" out/*.apk --clobber
          echo "::notice title=APK::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
