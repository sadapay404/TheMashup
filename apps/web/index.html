<!doctype html>
<html lang="en" data-theme="frosted">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta
      name="description"
      content="TheMashup — aggregated streaming, lyric search, downloads and endless radio in one local-first player."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TheMashup</title>
    <script>
      // Restore theme BEFORE first paint (no flash, survives restart).
      (function () {
        var theme = "frosted";
        try {
          var raw = localStorage.getItem("themashup.ui");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && typeof parsed.state.theme === "string") {
              theme = parsed.state.theme;
            }
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
