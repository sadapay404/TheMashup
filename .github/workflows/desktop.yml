name: Desktop (Windows/Linux)

# Phase 4. The development sandbox has no Rust and cannot reach crates.io, so the desktop client is
# compiled here, exactly like the APK. Produces an NSIS installer + MSI on Windows and an AppImage
# on Linux, plus the bundled app for quick inspection.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to build'
        required: true
        default: 'debug'
        type: choice
        options: [debug, bundle]
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: ${{ matrix.name }}-cargo-

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libssl-dev file

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Verify bundle
        run: test -f apps/web/dist/index.html

      # Rust unit tests run before any packaging: a failing assertion must stop the build here,
      # not after ten minutes of compiling an installer.
      # Each of these emits its first few error lines as annotations, so a failure is readable
      # without downloading logs (and without depending on a later step running).
      - name: Rust unit tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set +e
          cargo test --all-features --no-fail-fast 2>&1 | tee rust-test.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            # First the structured errors, then the raw tail: a panic's message is often not
            # prefixed with "error", so the tail is the only reliable way to see it.
            grep -E '^error(\[|:)|FAILED|panicked at|assertion' rust-test.log | head -8 | while IFS= read -r line; do
              echo "::error title=rust test::$(echo "$line" | head -c 700)"
            done
            tail -40 rust-test.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=rust test tail::$(echo "$line" | head -c 700)"
            done | tail -20
          fi
          exit $STATUS

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            grep -E '^error(\[|:)|^warning:' clippy.log | head -10 | while IFS= read -r line; do
              echo "::error title=clippy::$(echo "$line" | head -c 700)"
            done
          fi
          exit $STATUS

      # `tauri build` drives cargo itself and knows where the bundle must go. Doing it in one step
      # avoids compiling twice and keeps the artifact path in a single, canonical location.
      - name: Build (debug, no bundle)
        if: github.event.inputs.target != 'bundle'
        working-directory: apps/desktop
        shell: bash
        run: |
          set +e
          npx tauri build --debug --no-bundle 2>&1 | tee tauri-build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            grep -E '^error(\[|:)|error TS|panicked at|Failed to|Caused by' tauri-build.log | head -10 | while IFS= read -r line; do
              echo "::error title=tauri build::$(echo "$line" | head -c 700)"
            done
            tail -40 tauri-build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=tauri build tail::$(echo "$line" | head -c 700)"
            done | tail -20
          fi
          exit $STATUS

      - name: Build installers
        if: github.event.inputs.target == 'bundle'
        working-directory: apps/desktop
        run: npx tauri build 2>&1 | tee tauri-build.log

      - name: Report outcome as annotations
        if: always()
        shell: bash
        # `set -e` is on by default for GH runners: a `grep` with no match exits 1 and would fail
        # this reporting step. Every probe below is therefore explicitly non-fatal.
        run: |
          set +e
          for f in apps/desktop/src-tauri/rust-test.log apps/desktop/src-tauri/clippy.log apps/desktop/src-tauri/tauri-build.log; do
            [ -f "$f" ] || continue
            LINE="$(grep -m1 -E '^error(\[|:)|FAILED|panicked at|error TS' "$f" | head -c 800)"
            [ -n "$LINE" ] && echo "::warning title=$(basename "$f")::$(echo "$LINE" | tr '\n' ' ')"
          done

          EXE="$(find apps/desktop/src-tauri/target -maxdepth 3 -name 'themashup*' -type f 2>/dev/null | head -1)"
          if [ -n "$EXE" ]; then
            echo "::notice title=Desktop binary built::$(ls -lh "$EXE" | awk '{print $5, $9}')"
          else
            echo "::notice title=Desktop binary::not produced (see build step)"
          fi
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-logs
          path: |
            apps/desktop/src-tauri/*.log
            apps/desktop/*.log
            apps/desktop/src-tauri/target/debug/themashup*
            apps/desktop/src-tauri/target/debug/*.exe
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-app
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/debug/themashup
            apps/desktop/src-tauri/target/debug/themashup.exe
          retention-days: 30
          if-no-files-found: warn
