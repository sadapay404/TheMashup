name: Android APK

# One-shot APK factory: every push to this branch runs unit tests and
# produces a debug APK artifact — no local build round-trips.

on:
  push:
    branches: [arena/af3d0d7b-themashup]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform 35
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          cd android && ./gradlew --no-daemon test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd android && ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/assemble.log"

      - name: Dump failure details to step summary (readable via API)
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/assemble.log"; do
            [ -f "$f" ] || continue
            echo "### \`${f##*/}\` (failure extract)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |error:|FAILED|What went wrong|Caused by:|tests completed|BUILD FAILED" -A2 "$f" | tail -n 150 >> "$GITHUB_STEP_SUMMARY" || true
            echo "--- tail ---" >> "$GITHUB_STEP_SUMMARY"
            tail -n 220 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Surface failing tests as annotations (API-readable)
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/fails.txt" 2>&1 || true
          import glob, xml.etree.ElementTree as ET, pathlib
          rows = []
          for f in glob.glob("android/app/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter("testcase"):
                  bad = tc.find("failure")
                  if bad is None:
                      bad = tc.find("error")
                  if bad is not None:
                      msg = (bad.get("message") or "").replace("\n", " ")[:200]
                      rows.append(f'{tc.get("classname")}#{tc.get("name")}: {msg}')
          if rows:
              print("FAILING TESTS (from JUnit XML):")
              for r in rows[:80]:
                  print(" -", r)
              print("::error::" + " || ".join(rows[:8]))
          else:
              print("no junit failures parsed — failure before/at test execution")
          for f in sorted(pathlib.Path("android/app/build").rglob("*.html"))[:0]:
              pass
          PY
          cat "$RUNNER_TEMP/fails.txt" >> "$GITHUB_STEP_SUMMARY"
          grep "^::error::" "$RUNNER_TEMP/fails.txt" || true

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheMashup-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
