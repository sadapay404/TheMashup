name: Android APK

# Builds a real, installable APK on GitHub's runners (which have the JDK + Android SDK that the
# development sandbox lacks). Artifacts attach to the run; no hosting, no app store needed.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavour'
        required: true
        default: 'both'
        type: choice
        options: [both, standard, withNativeExtractor]
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
  push:
    tags:
      - 'v*'

# `write` is required to attach the APK to a GitHub Release. The workflow only writes on tag
# builds (guarded by `if:`); push builds still only read.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Verify bundle
        run: test -f apps/web/dist/index.html

      # The ubuntu-latest image ships the Android SDK at $ANDROID_HOME. A third-party setup action
      # is one more thing that can break, so we verify what is already there instead.
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK root: $SDK"
          ls "$SDK/platforms" || true
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            # compileSdk 35 (see variables.gradle). Installed explicitly rather than relying on the
            # runner image: a missing platform fails the whole build with an unhelpful message.
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms"

      # `cap sync`, not `cap copy`. `copy` only moves web assets; `sync` also (re)generates
      # android/app/src/main/assets/capacitor.plugins.json, which the bridge reads at startup.
      # Without it BridgeActivity logs "Could not load capacitor.plugins.json" on every launch - it
      # survives the error, but every plugin class is then resolved the slow way, and the failure
      # noise hides real startup problems.
      - name: Sync Capacitor
        working-directory: apps/android
        run: npx cap sync android

      # Fail loudly if the generated manifest is still missing, rather than shipping an APK whose
      # plugin table is empty and only discovering it from a user's logcat.
      - name: Verify plugin manifest
        working-directory: apps/android
        run: |
          FILE=android/app/src/main/assets/capacitor.plugins.json
          if [ ! -f "$FILE" ]; then
            echo "::error::capacitor.plugins.json was not generated by cap sync"
            exit 1
          fi
          echo "Plugin manifest:"
          cat "$FILE"

      # `secrets` is unavailable in step-level `if:` — pass it through env and branch in shell.
      # `v0.3.0-apk.31` -> code 31, name "0.3.0-apk.31". A branch build gets the run number, so two
      # APKs can never share an identity.
      - name: Derive version
        id: ver
        run: |
          REF="${GITHUB_REF_NAME:-}"
          TAGNUM="$(sed -n 's/.*apk\.\([0-9]*\).*/\1/p' <<< "$REF")"
          if [ -n "$TAGNUM" ]; then
            echo "code=$TAGNUM" >> "$GITHUB_OUTPUT"
            echo "name=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=0.4.0-run.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.MASHUP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/themashup.jks"
            echo "MASHUP_KEYSTORE_PATH=$RUNNER_TEMP/themashup.jks" >> "$GITHUB_ENV"
            echo "✓ signing keystore decoded"
          else
            # Say it loudly. The debug key is generated per machine, so an APK signed with it will not
            # install over one built on a different runner ("App not installed", no explanation). If
            # the release already has an APK, the cause is almost certainly this line, so name it.
            echo "::warning title=Unsigned release::No MASHUP_KEYSTORE_BASE64 secret — this APK is signed with a per-runner debug key and will NOT install over a previous build. Add the keystore secret to fix." 
            echo "ℹ no keystore secret — building with the debug key"
          fi

      # JitPack compiles artefacts on demand. A first request for a fresh tag can take several minutes
      # and a cold JitPack can answer 502 once before it has the artefact — which reads in a Gradle log
      # as "Could not resolve", identical to the dependency being unpublished. Asking for the POM once
      # beforehand separates the two, and the wait is bounded.
      - name: Warm the JitPack artefact (enhanced flavour only)
        if: github.event.inputs.flavor != 'standard'
        run: |
          set +e
          for ATTEMPT in 1 2 3 4 5 6; do
            CODE="$(curl -s -o /dev/null -m 60 -w '%{http_code}' \
              https://jitpack.io/com/github/TeamNewPipe/NewPipeExtractor/v0.27.1/NewPipeExtractor-v0.27.1.pom)"
            echo "attempt $ATTEMPT -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            if [ "$CODE" = "404" ]; then
              echo "::error title=NewPipeExtractor unpublished::JitPack has no v0.27.1 artefact (HTTP 404). The GPL APK cannot be built from this pin."
              exit 1
            fi
            sleep 20
          done
          echo "::warning title=JitPack slow::Still answering $CODE after six attempts; letting Gradle try anyway."

      - name: Assemble
        working-directory: apps/android/android
        env:
          # Derived from the tag so every APK reports a distinguishable build.
          MASHUP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          MASHUP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          MASHUP_KEYSTORE_PASSWORD: ${{ secrets.MASHUP_KEYSTORE_PASSWORD }}
          MASHUP_KEY_ALIAS: ${{ secrets.MASHUP_KEY_ALIAS }}
          MASHUP_KEY_PASSWORD: ${{ secrets.MASHUP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # Tag pushes carry no inputs, so the default matters. A tag is a release: build release
          # variant (R8-minified, no debug badge, faster runtime). Manual runs can still ask for debug.
          # A tag push carries no inputs. A tag is a release, and the release must contain the build
          # that can actually play a full song — the GPL flavour — alongside the standard one. This
          # used to default to `standard` only, so the very APK that carried the native resolver was
          # never the APK that was published.
          FLAVOR="${{ github.event.inputs.flavor || 'both' }}"
          # Third source of truth for the build type, in priority order: an explicit manual input,
          # then the tag name, then release. A tag ending in -debug produces a debuggable,
          # unminified APK, which is what tells us whether a crash lives in the R8 output or in the
          # app; without this a diagnostic tag would silently build the very variant under suspicion.
          TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$TYPE" ]; then
            case "${GITHUB_REF_NAME:-}" in
              *-debug) TYPE="debug" ;;
              *) TYPE="release" ;;
            esac
          fi
          echo "Build type: $TYPE"
          TASK_TYPE="$(tr '[:lower:]' '[:upper:]' <<< "${TYPE:0:1}")${TYPE:1}"

          TASKS=""
          if [ "$FLAVOR" = "both" ]; then
            TASKS=":app:assembleStandard${TASK_TYPE} :app:assembleWithNativeExtractor${TASK_TYPE}"
          elif [ "$FLAVOR" = "withNativeExtractor" ]; then
            TASKS=":app:assembleWithNativeExtractor${TASK_TYPE}"
          else
            TASKS=":app:assembleStandard${TASK_TYPE}"
          fi

          echo "Running: ./gradlew $TASKS"
          set +e
          ./gradlew $TASKS --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-build.log
          STATUS=${PIPESTATUS[0]}
          # Surface the first real error lines as a check annotation so failures are readable
          # without downloading logs.
          if [ $STATUS -ne 0 ]; then
            grep -E '^e: |error:|FAILURE:|What went wrong|Caused by' gradle-build.log | head -12 | while IFS= read -r line; do
              echo "::error title=kotlin::$(echo "$line" | head -c 800)"
            done
            tail -30 gradle-build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=gradle tail::$(echo "$line" | head -c 800)"
            done
          else
            # A clean build is not the same as a correct build: Kotlin warnings are where deprecated
            # or misused APIs show up. Surface them even on success.
            COUNT="$(grep -cE '^w: ' gradle-build.log 2>/dev/null || echo 0)"
            echo "::notice title=Kotlin warnings::$COUNT"
            grep -E '^w: ' gradle-build.log | head -12 | while IFS= read -r line; do
              echo "::warning title=kotlin::$(echo "$line" | head -c 800)"
            done
          fi
          exit $STATUS

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: apps/android/android/gradle-build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find apps/android/android/app/build/outputs -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -lh out/ || echo "no APKs found"
          # Name the failure precisely: an APK that failed to build is not the same as a build that
          # succeeded and was never copied, and the release step must not publish a partial set.
          if [ "${{ github.event.inputs.flavor || 'both' }}" = "both" ]; then
            for want in standard withNativeExtractor; do
              if ! ls out/app-${want}-*.apk >/dev/null 2>&1; then
                echo "::error title=missing APK::app-${want}-*.apk was not produced"
                exit 1
              fi
            done
          fi

      # Prove the artefact is a real, signed APK rather than a renamed zip. The verdict is emitted
      # as a check annotation so it is visible without downloading 8 MB.
      - name: Verify APK integrity
        if: always()
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          COUNT="$(ls out/*.apk 2>/dev/null | wc -l)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error title=No APK::the build produced no .apk in out/"
            exit 1
          fi
          # Verify EVERY artefact, not just the first. A signed standard APK next to a corrupt GPL
          # one would previously have been reported as "the APK is fine".
          : > out/apk-verification.txt
          for APK in out/*.apk; do
            if [ -x "$BT/aapt2" ]; then
              BADGING="$("$BT/aapt2" dump badging "$APK" 2>&1 | grep -E "^package:|^application-label:|sdkVersion|targetSdkVersion" | tr '\n' ' ')"
            else
              BADGING="aapt2 unavailable"
            fi
            if [ -x "$BT/apksigner" ]; then
              SIGNER="$("$BT/apksigner" verify --print-certs "$APK" 2>&1 | grep -i "certificate DN" | head -1)"
              VERIFY="$( "$BT/apksigner" verify "$APK" > /dev/null 2>&1 && echo SIGNED-VALID || echo SIGNATURE-INVALID )"
            else
              SIGNER="apksigner unavailable"; VERIFY="unknown"
            fi
            SIZE="$(du -h "$APK" | cut -f1)"
            echo "APK: $APK ($SIZE) — $VERIFY"
            echo "::notice title=APK built ($(basename "$APK"), $SIZE)::$BADGING | $VERIFY | $SIGNER"
            echo "$(basename "$APK") | $BADGING | $VERIFY | $SIGNER" >> out/apk-verification.txt
            if [ "$VERIFY" = "SIGNATURE-INVALID" ]; then
              echo "::error title=Bad signature::$(basename "$APK") is not validly signed"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: themashup-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: warn

      # Artifact downloads require a GitHub login and expire in 30 days. A tag build is a release, so
      # publish the APK there too: the asset URL works from a phone browser with no account, which is
      # the only way to sideload without a cable.
      - name: Publish APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Report the actual failure as an annotation: the log is not always downloadable, and
          # "exit code 1" with no cause is the least useful thing CI can say.
          trap 'echo "::error title=release publish failed::gh CLI exited $? for tag $TAG" >&2' ERR
          # Idempotent: a re-run of the same tag must not fail on "release already exists".
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "TheMashup $TAG" --notes-file .github/apk-release-notes.md
          gh release upload "$TAG" out/*.apk --clobber
          echo "::notice title=APK::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
