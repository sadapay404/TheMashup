name: Android APK

# Produces a real, installable APK on GitHub's runners (which have the Android SDK + JDK that the
# development sandbox does not). Artifacts are attached to the workflow run; no hosting required.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavour'
        required: true
        default: 'standard'
        type: choice
        options: [standard, withNativeExtractor, both]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Verify the bundle exists
        run: test -f apps/web/dist/index.html

      - name: Sync web bundle into Android assets
        run: node scripts/sync-android.mjs

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android/android/**/*.gradle*', 'apps/android/android/gradle/wrapper/*') }}

      - name: Decode signing keystore (optional)
        if: ${{ secrets.MASHUP_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.MASHUP_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/themashup.jks"
          echo "MASHUP_KEYSTORE_PATH=$RUNNER_TEMP/themashup.jks" >> $GITHUB_ENV

      - name: Assemble APKs
        working-directory: apps/android/android
        env:
          MASHUP_KEYSTORE_PASSWORD: ${{ secrets.MASHUP_KEYSTORE_PASSWORD }}
          MASHUP_KEY_ALIAS: ${{ secrets.MASHUP_KEY_ALIAS }}
          MASHUP_KEY_PASSWORD: ${{ secrets.MASHUP_KEY_PASSWORD }}
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'standard' }}"
          if [ "$FLAVOR" = "both" ]; then
            ./gradlew :app:assembleStandardRelease :app:assembleWithNativeExtractorRelease --no-daemon
          elif [ "$FLAVOR" = "withNativeExtractor" ]; then
            ./gradlew :app:assembleWithNativeExtractorRelease --no-daemon
          else
            ./gradlew :app:assembleStandardRelease --no-daemon
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          find apps/android/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: themashup-apk
          path: out/*.apk
          retention-days: 30
