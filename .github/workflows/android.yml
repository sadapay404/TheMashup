name: Android APK

on:
  push:
    branches: [arena/9f29da6a-themashup]
  workflow_dispatch:

# Limit the workflow token to checkout and artifact reads.
permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # N9 — static ffmpeg built from source (Javernaut/ffmpeg-android-maker, the
  # method the FOSS reference players use) and bundled into the APK as
  # jniLibs/<abi>/libffmpeg.so. Replaces the BtbN glibc tarball that could
  # never exec on Android ("downloads but fails to bundle").
  ffmpeg:
    name: Static ffmpeg (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - name: Checkout (workflow reference)
        uses: actions/checkout@v4

      - name: Host build tools
        run: sudo apt-get update && sudo apt-get install -y meson nasm ninja-build pkg-config

      - name: Build static ffmpeg for ${{ matrix.abi }}
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/Javernaut/ffmpeg-android-maker.git "$RUNNER_TEMP/fam"
          cd "$RUNNER_TEMP/fam"
          # Static libav* so the executable links everything in (single-file
          # bundle; no versioned .so names for jniLibs to package).
          sed -i 's/--enable-shared/--disable-shared/; s/--disable-static/--enable-static/' scripts/ffmpeg/build.sh
          export ANDROID_SDK_HOME="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # lame + opus (encoders our 4 download commands need) + x264 (mp4 re-encode).
          ./ffmpeg-android-maker.sh -mp3lame -opus -x264 -android=24 -abis=${{ matrix.abi }} 2>&1 | tee "$RUNNER_TEMP/fam-${{ matrix.abi }}.log"

      - name: Surface ffmpeg build failure as annotation (API-readable)
        if: failure()
        shell: bash
        run: |
          F="$RUNNER_TEMP/fam-${{ matrix.abi }}.log"
          if [ -f "$F" ]; then
            {
              echo "### ffmpeg build failure (${{ matrix.abi }})"
              echo '```'
              tail -n 80 "$F"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - "$F" <<'PY'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          excerpt = "\n".join(lines[-100:])[-24000:]
          excerpt = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=FFmpeg build log tail::" + excerpt)
          PY
          else
            echo "::error::ffmpeg ${{ matrix.abi }} failed before producing a log"
          fi

      - name: Stage jniLibs payload
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/staging/${{ matrix.abi }}"
          mkdir -p "$STAGE"
          SRC="$RUNNER_TEMP/fam/build/ffmpeg/${{ matrix.abi }}/bin/ffmpeg"
          test -f "$SRC"
          cp "$SRC" "$STAGE/libffmpeg.so"
          file "$STAGE/libffmpeg.so"
          # No text relocations (same rule as ffmpeg-android-maker's own CI).
          ! readelf --dynamic "$STAGE/libffmpeg.so" | grep -q TEXTREL
          # Smoke-run under the runner's own glibc just to sanity-check the ELF
          # executed-and-exited machinery (bionic paths won't match here).
          ls -la "$STAGE"

      - name: Upload ffmpeg (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: ${{ runner.temp }}/staging
          if-no-files-found: error
          retention-days: 7

  build:
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack bundled ffmpeg into jniLibs
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: android/app/src/main/jniLibs
          merge-multiple: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform 35
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          cd android && ./gradlew --no-daemon test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd android && ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/assemble.log"

      - name: Dump failure details to step summary (readable via API)
        if: failure()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/assemble.log"; do
            [ -f "$f" ] || continue
            echo "### \`${f##*/}\` (failure extract)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |error:|FAILED|What went wrong|Caused by:|tests completed|BUILD FAILED" -A2 "$f" | tail -n 150 >> "$GITHUB_STEP_SUMMARY" || true
            echo "--- tail ---" >> "$GITHUB_STEP_SUMMARY"
            tail -n 220 "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Surface failing tests as annotations (API-readable)
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/fails.txt" 2>&1 || true
          import glob, xml.etree.ElementTree as ET, pathlib
          rows = []
          for f in glob.glob("android/app/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter("testcase"):
                  bad = tc.find("failure")
                  if bad is None:
                      bad = tc.find("error")
                  if bad is not None:
                      msg = (bad.get("message") or "").replace("\n", " ")[:200]
                      rows.append(f'{tc.get("classname")}#{tc.get("name")}: {msg}')
          if rows:
              print("FAILING TESTS (from JUnit XML):")
              for r in rows[:80]:
                  print(" -", r)
              print("::error::" + " || ".join(rows[:8]))
          else:
              print("no junit failures parsed — failure before/at test execution")
          # Kotlin/Gradle compile errors — surface them as annotations too.
          # (single-quoted heredoc: expand RUNNER_TEMP via the environment)
          import re, os
          elines = []
          _rt = os.environ.get("RUNNER_TEMP", "")
          for logf in (os.path.join(_rt, "test.log"), os.path.join(_rt, "assemble.log")):
              try:
                  with open(logf, "r", errors="replace") as fh:
                      for line in fh:
                          if re.match(r"^(e: |FAILURE: |\* What went wrong)", line):
                              elines.append(line.strip()[:400])
              except OSError:
                  pass
          if elines:
              print("COMPILE/RUNTIME ERRORS:")
              for line in elines[:40]:
                  print(" -", line)
              print("::error::" + " || ".join(elines[:6]))
          else:
              print(f"logs scanned: {_rt}/test.log, {_rt}/assemble.log (no e:/FAILURE markers found)")
          for f in sorted(pathlib.Path("android/app/build").rglob("*.html"))[:0]:
              pass
          PY
          cat "$RUNNER_TEMP/fails.txt" >> "$GITHUB_STEP_SUMMARY"
          grep "^::error::" "$RUNNER_TEMP/fails.txt" || true

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheMashup-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
