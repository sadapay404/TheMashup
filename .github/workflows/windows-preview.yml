name: Windows preview checks

# This workflow does not run the Android build and does not create an EXE.
on:
  push:
    branches: [arena/af3d0d7b-themashup]
    paths:
      - 'windows/**'
      - 'apps/api/**'
      - 'services/resolver/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: windows

jobs:
  browser-and-core:
    name: Shared UI, tests and browser preview (no EXE)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test the existing search backend
        run: |
          set -o pipefail
          cd ..
          npx --yes pnpm@9.15.4 install --frozen-lockfile --filter '@themashup/api...'
          python -m pip install -r services/resolver/requirements.txt
          npx --yes pnpm@9.15.4 --filter @themashup/api typecheck 2>&1 | tee "$RUNNER_TEMP/windows-api-typecheck.log"
          npx --yes pnpm@9.15.4 --filter @themashup/api test 2>&1 | tee "$RUNNER_TEMP/windows-api-tests.log"
          (cd services/resolver && python -m pytest -q tests) 2>&1 | tee "$RUNNER_TEMP/windows-resolver-tests.log"
          THEMASHUP_PYTHON="$(command -v python)" node windows/tests/backend/integration.mjs 2>&1 | tee "$RUNNER_TEMP/windows-backend-integration.log"
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install browser workload
        run: |
          set -o pipefail
          dotnet workload install wasm-tools --skip-manifest-update 2>&1 | tee "$RUNNER_TEMP/windows-workload.log"
      - name: Core tests
        run: |
          set -o pipefail
          dotnet test tests/TheMashup.Core.Tests/TheMashup.Core.Tests.csproj -c Release --nologo 2>&1 | tee "$RUNNER_TEMP/windows-core.log"
          summary=$(grep -E "^Passed!" "$RUNNER_TEMP/windows-core.log" | tail -n 1)
          echo "::notice title=Windows core tests::$summary"
      - name: Compile desktop managed assemblies without an EXE
        run: |
          set -o pipefail
          dotnet build src/TheMashup.Desktop/TheMashup.Desktop.csproj -c Release -p:UseAppHost=false --nologo 2>&1 | tee "$RUNNER_TEMP/windows-desktop.log"
          if find src -path '*/bin/*' -type f -iname '*.exe' -print -quit | grep -q .; then
            echo 'Unexpected EXE in build output' >&2
            exit 1
          fi
      - name: Publish browser preview with temporary storage
        env:
          THEMASHUP_PREVIEW_DIR: ${{ runner.temp }}/themashup-windows-preview
        run: |
          set -o pipefail
          # Simulate an unwritable source/home location: preview output must be
          # placed in the separate temporary directory, not beside the code.
          chmod -R a-w src
          mkdir -p "$RUNNER_TEMP/read-only-home"
          chmod 500 "$RUNNER_TEMP/read-only-home"
          HOME="$RUNNER_TEMP/read-only-home" bash scripts/preview.sh --build-only 2>&1 | tee "$RUNNER_TEMP/windows-browser.log"
          if find src "$THEMASHUP_PREVIEW_DIR/artifacts" -type f -iname '*.exe' -print -quit | grep -q .; then
            echo 'Unexpected EXE in preview/source output' >&2
            exit 1
          fi
      - name: Install browser test dependencies
        run: |
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser && npx playwright install --with-deps chromium
      - name: Exercise the real browser preview
        run: |
          set -o pipefail
          webroot=$(cat "$RUNNER_TEMP/themashup-windows-preview/webroot.path")
          THEMASHUP_PYTHON="$(command -v python)" node tests/browser/run-smoke.mjs "$webroot" 2>&1 | tee "$RUNNER_TEMP/windows-smoke.log"
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-screenshots
          path: windows/tests/browser/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Surface failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          paths = glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'windows-*.log'))
          for path in paths:
              try:
                  lines = open(path, encoding='utf-8', errors='replace').read().splitlines()
              except OSError:
                  continue
              useful = [line for line in lines if len(line) < 4000 and not line.startswith('::notice') and re.search(r'\berror\s+[A-Z]+[0-9]+\s*:|\berror:|\bfailed\b|\bexception:|[A-Za-z]+Exception\b|AssertionError|TimeoutError|timed?\s*out|^::error', line, re.I) and not re.search(r'Passed!\s*-\s*Failed:\s*0|0 Error\(s\)', line)]
              if not useful:
                  continue
              text = ('\n'.join(useful[-35:]))[-18000:]
              escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title={os.path.basename(path)}::{escaped}")
          PY
