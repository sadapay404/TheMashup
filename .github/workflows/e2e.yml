name: Web E2E + Visual

# Closes the gap the build sandbox could not: real Chromium, real screenshots, real console-error
# assertions. Runs on every push that touches the web app.

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test --config apps/web/playwright.config.ts
        env:
          CI: true

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/screenshots
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
