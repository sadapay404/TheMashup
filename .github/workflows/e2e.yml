name: Web E2E + Visual

# Closes the gap the build sandbox could not: real Chromium, real screenshots, real console-error
# assertions. Runs on every push that touches the web app.

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Run Playwright
        id: pw
        run: |
          set +e
          npx playwright test --config apps/web/playwright.config.ts --reporter=json > pw.json 2> pw.err
          STATUS=$?
          node -e "
            const fs = require('fs');
            let raw = '';
            try { raw = fs.readFileSync('pw.json', 'utf8'); } catch {}
            const out = [];
            try {
              const r = JSON.parse(raw.slice(raw.indexOf('{')));
              const walk = (suite, path = '') => {
                const here = suite.title ? (path ? path + ' › ' + suite.title : suite.title) : path;
                for (const spec of suite.specs || []) {
                  for (const t of spec.tests || []) {
                    const res = (t.results || [])[0];
                    if (res && res.status !== 'passed' && res.status !== 'skipped') {
                      const msg = (res.error && (res.error.message || res.error.value)) || 'no message';
                      out.push('::error title=Playwright: ' + spec.title.replace(/[%\r\n]/g, ' ') + '::' + here.replace(/[%\r\n]/g,' ').slice(0,120) + ' — ' + String(msg).replace(/[%\r\n]/g, ' ').slice(0, 900));
                    }
                  }
                }
                for (const s2 of suite.suites || []) walk(s2, here);
              };
              for (const s of r.suites || []) walk(s);
            } catch (e) { out.push('::error title=Playwright report unreadable::' + String(e).slice(0,200)); }
            console.log(out.join('\n') || '::warning title=Playwright::no failures parsed');
          " || true
          echo "--- stderr tail ---"
          tail -40 pw.err || true
          exit $STATUS
        env:
          CI: true

      # The soak is its own job so a memory regression is reported separately from a UI regression.
      - name: Leak soak (fast)
        run: |
          npx playwright test --config apps/web/playwright.config.ts soak.spec.ts \
            --reporter=line 2>&1 | tee soak.log
        env:
          CI: true
          SOAK_CYCLES: 12
          SOAK_CYCLE_MS: 1200

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/screenshots
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
