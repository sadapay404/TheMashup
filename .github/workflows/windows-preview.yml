name: Windows preview checks

# This workflow does not run the Android build and does not create an EXE.
on:
  push:
    branches: [arena/af3d0d7b-themashup]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: windows

jobs:
  browser-and-core:
    name: Shared UI, tests and browser preview (no EXE)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PREVIEW_SNAPSHOT_BRIDGE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install browser workload
        run: |
          set -o pipefail
          dotnet workload install wasm-tools --skip-manifest-update 2>&1 | tee "$RUNNER_TEMP/windows-workload.log"
      - name: Core tests
        run: |
          set -o pipefail
          dotnet test tests/TheMashup.Core.Tests/TheMashup.Core.Tests.csproj -c Release --nologo 2>&1 | tee "$RUNNER_TEMP/windows-core.log"
      - name: Compile desktop managed assemblies without an EXE
        run: |
          set -o pipefail
          dotnet build src/TheMashup.Desktop/TheMashup.Desktop.csproj -c Release -p:UseAppHost=false --nologo 2>&1 | tee "$RUNNER_TEMP/windows-desktop.log"
          if find src -path '*/bin/*' -type f -iname '*.exe' -print -quit | grep -q .; then
            echo 'Unexpected EXE in build output' >&2
            exit 1
          fi
      - name: Publish browser preview
        run: |
          set -o pipefail
          dotnet publish src/TheMashup.Browser/TheMashup.Browser.csproj -c Release --nologo 2>&1 | tee "$RUNNER_TEMP/windows-browser.log"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser && npx playwright install --with-deps chromium
      - name: Exercise the real browser preview
        run: |
          set -o pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 --directory src/TheMashup.Browser/bin/Release/net10.0-browser/publish/wwwroot > "$RUNNER_TEMP/windows-http.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node tests/browser/smoke.mjs 2>&1 | tee "$RUNNER_TEMP/windows-smoke.log"
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-screenshots
          path: windows/tests/browser/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Surface failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re
          paths = glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'windows-*.log'))
          for path in paths:
              try:
                  lines = open(path, encoding='utf-8', errors='replace').read().splitlines()
              except OSError:
                  continue
              useful = [line for line in lines if re.search(r'error|failed|exception|assert|timed? out|NU[0-9]+', line, re.I)]
              if not useful:
                  continue
              text = ('\n'.join(useful[-35:]))[-18000:]
              escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title={os.path.basename(path)}::{escaped}")
          PY
